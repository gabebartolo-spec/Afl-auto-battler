name: Android debug build

# A debug APK of any branch, for the director's phone: the visual audit's 4.8
# measurement (frame time of the vignettes on a real Android phone). A debug
# build shows the frame-time probe (scripts/core/PerfProbe.gd) in the corner and
# logs each screen's figures to user://perf_probe.csv. Start it by hand:
#
#   gh workflow run android-debug.yml --ref <branch>
#   gh run download <run-id> -n android-debug-apk
#
# Signed with a throwaway debug key made on the runner: install it by sideloading
# (allow "install unknown apps"), not through the Play Store.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and its export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-android-${{ env.GODOT_VERSION }}

      - name: Download Godot and the export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --retry 3 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          curl -fsSL --retry 3 -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q templates.tpz -d tpl && mv tpl/templates/* "$dest/" && rm -rf tpl templates.tpz

      - name: Debug keystore and editor settings
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION%.*}.tres"; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
            sed -i 's/^          //' ~/.config/godot/$f
          done
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import and export the APK
        run: |
          timeout 900 "$HOME/godot/godot" --headless --path . --editor --import > import.log 2>&1 || true
          mkdir -p builds
          timeout 900 "$HOME/godot/godot" --headless --path . --export-debug "Android Debug" \
            "$PWD/builds/aussie-rules-dynasties-debug.apk" > export.log 2>&1 || true
          tail -n 40 export.log
          test -s builds/aussie-rules-dynasties-debug.apk
          ls -la builds

      - name: Upload the APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            builds/*.apk
            export.log
          if-no-files-found: warn
          retention-days: 14
