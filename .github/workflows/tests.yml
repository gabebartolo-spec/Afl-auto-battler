name: Tests

# Code/data/config pull requests and pushes to main run the full check:
# project import, every Godot test suite, the dataset check and the intake
# harness. Documentation-only changes skip this expensive game test run.
# If a PR changes both docs and game files, the tests still run.
# Two more cases skip the game tests (the plan job sets code=false): a draft PR
# (a run starts when it is marked ready for review), and a PR that only touches
# audit or capture scripts (tools/audit, tools/visual), which no suite loads.
#
# The suites run as parallel shards (tools/ci_shards.txt), so a pull request
# spreads the workload across runners. Every tests/run_<suite>_tests.gd is a
# suite; nothing lists them by hand. The layout is planned from a real run's
# suite timings (tools/ci_suite_timings.json); a suite added since the last
# re-plan joins the lightest shard on its own (tools/ci_shards.py). The test job prints each shard's
# observed time and warns when one runs long, but never fails on it. The
# league_balance suite (a developer tool) runs on pushes to main, not on pull
# requests. One more job runs the
# dataset, export-data and harness checks once. tools/run_tests.sh is the same
# script you run locally, on every suite or on some of them.
#
# "test" is a required check on main. It is the last job and passes when the
# plan, every shard and the extras job passed. For a docs-only PR the shards are
# skipped and it passes in seconds. Pushes to main that only touch docs don't
# start this workflow at all.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  # Nightly on main: the balance suites that pull requests skip
  # (balance, league_balance, calibration). 16:00 UTC is 03:00 in Melbourne (AEDT).
  schedule:
    - cron: "0 16 * * *"

# A newer push to a PR supersedes its older run. Every push to main gets its own
# group (its sha) and is never cancelled, so back-to-back merges each get a verdict.
concurrency:
  group: tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  actions: read          # tools/ci_same_tree.sh reads the PR's green run
  pull-requests: read

env:
  GODOT_VERSION: "4.7.2"

jobs:
  # Decides whether the game tests run, and lays out the shards.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
      reason: ${{ steps.changes.outputs.reason }}
      sim: ${{ steps.changes.outputs.sim }}
      shards: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # the PR merge commit and the base it merges into

      # Anything outside docs/, *.md files and the audit and capture scripts
      # (tools/audit/, tools/visual/) counts as code. A draft PR runs no game
      # tests until it is marked ready for review.
      - name: Check for code changes
        id: changes
        env:
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          code=true
          reason=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$IS_DRAFT" = "true" ]; then
              code=false
              reason="draft pull request: the game tests run when it is marked ready for review"
            elif ! git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$|^tools/audit/|^tools/visual/'; then
              code=false
              reason="documentation, audit or capture scripts only"
            fi
          fi
          # A push to main whose files are exactly what the PR's last green run
          # tested (an up-to-date branch squashed) proves nothing new: skip the
          # shards. Any doubt runs them; the log says which and why.
          if [ "${{ github.event_name }}" = push ]; then
            if why=$(GH_TOKEN="${{ github.token }}" bash tools/ci_same_tree.sh "${{ github.sha }}" "${{ github.repository }}"); then
              code=false
              reason="${why#Skip: }"
            fi
            echo "$why"
          fi
          if [ "$code" = false ]; then echo "Skipping the game tests ($reason)."; fi
          # Pull requests run calibration only when the sim or the data changed.
          sim=true
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(scripts/sim/|data/)'; then
            sim=false
          fi
          echo "sim=$sim" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      # Every suite on disk runs in exactly one shard: a new one joins the
      # lightest shard, a removed one is dropped (tools/ci_shards.py).
      - name: Lay out the shards
        id: shards
        run: |
          matrix=$(python3 tools/ci_shards.py --matrix)
          # Balance suites (director 2026-10-19): pull requests skip balance and
          # league_balance, and run calibration only when scripts/sim/ or data/
          # changed; the nightly schedule runs just those three; main pushes and
          # manual runs run everything. A shard left with no suite is dropped
          # (an empty list would make run_tests.sh run every suite).
          case "${{ github.event_name }}" in
            pull_request) mode=drop; picked="balance league_balance"; [ "${{ steps.changes.outputs.sim }}" = true ] || picked="$picked calibration" ;;
            schedule) mode=keep; picked="balance league_balance calibration" ;;
            *) mode=drop; picked="" ;;
          esac
          matrix=$(printf '%s' "$matrix" | MODE="$mode" PICKED="$picked" python3 -c 'import json,os,sys; m=json.load(sys.stdin); p=set(os.environ["PICKED"].split()); keep=os.environ["MODE"]=="keep"; [g.update(suites=" ".join(s for s in g["suites"].split() if (s in p)==keep)) for g in m["include"]]; m["include"]=[g for g in m["include"] if g["suites"]]; print(json.dumps(m))')
          echo "Shards: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # A document every agent must read in full has to fit one read (director,
      # 2026-10-10: skimming is a sin; a doc too long to read is split, never skimmed).
      - name: Check must-read documents fit one read
        run: python3 tools/check_doc_sizes.py

      # The build number lives in project.godot config/version and nowhere else.
      - name: Check the build number has one source
        run: |
          python3 tools/test_check_version.py
          python3 -I tools/check_version.py

      # The shard layout's own tests, and the estimated shard seconds. Imbalance
      # is reported after the run, never a failure. Never reduce assertions to speed CI up.
      - name: Check the shard layout
        run: |
          python3 tools/test_ci_shards.py
          python3 tools/check_ci_balance.py

  # A test runner that does not compile (or hangs on load) fails here in seconds,
  # not as a 15-minute shard timeout. Only the compile check: no suite runs here,
  # so the shards start as soon as it passes.
  preflight:
    needs: plan
    if: needs.plan.outputs.code == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && rm godot.zip
          mv "${name}" godot && chmod +x godot

      # Every test runner must compile, and its load must not hang, before the
      # shards start: a runner naming a class whose load chain reaches an autoload
      # hung a shard for the full 900 s timeout three times on 2026-10-17/18.
      - name: Every test runner compiles
        run: GODOT="$HOME/godot/godot" bash tools/ci_preflight_compile.sh

  shard:
    name: shard ${{ matrix.shard }}
    needs: [plan, preflight]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.code == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # PRs release runner slots promptly; main/manual diagnostics collect all failures.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && rm godot.zip
          mv "${name}" godot && chmod +x godot

      - name: Run the suites in this shard
        env:
          SUITES: ${{ matrix.suites }}
          STOP_ON_FAILURE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: SUITES_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh $SUITES

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-logs

      - name: Preserve suite timings even when tests fail
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/timings"
          if [ -f "$RUNNER_TEMP/test-logs/suite-timings.tsv" ]; then
            cp "$RUNNER_TEMP/test-logs/suite-timings.tsv" "$RUNNER_TEMP/timings/shard-${{ matrix.shard }}.tsv"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: suite-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/timings
          if-no-files-found: warn

  # What run_tests.sh does after the suites: the dataset check, the exported
  # build's data check, the intake harness and the runner's own self-test.
  # (The build-number check ran once, in plan.)
  extras:
    name: dataset and harness checks
    needs: [plan, preflight]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.code == 'true' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && rm godot.zip
          mv "${name}" godot && chmod +x godot

      - name: Run the dataset, export and harness checks
        run: SKIP_VERSION_CHECK=1 EXTRAS_ONLY=1 GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-extras
          path: ${{ runner.temp }}/test-logs

  # The required check. Its name stays "test" so branch protection is unchanged.
  test:
    needs: [plan, preflight, shard, extras]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        if: needs.plan.outputs.code == 'true' && needs.plan.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')

      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.code == 'true' && needs.plan.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
        with:
          pattern: suite-timings-*
          path: ${{ runner.temp }}/suite-timings
          merge-multiple: true

      - name: Report observed shard imbalance
        if: needs.plan.outputs.code == 'true' && needs.plan.result == 'success' && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped')
        run: python3 tools/check_ci_balance.py --observed "$RUNNER_TEMP/suite-timings"

      # Records the exact files this green run tested, so the push to main that
      # squashes this PR unchanged can skip its shards (tools/ci_same_tree.sh).
      - name: Record the tested tree
        id: tree
        if: github.event_name == 'pull_request' && needs.plan.outputs.code == 'true' && needs.shard.result == 'success' && needs.extras.result == 'success' && needs.preflight.result == 'success'
        run: |
          tree=$(git rev-parse HEAD^{tree})
          echo "$tree" > "$RUNNER_TEMP/tree.txt"
          echo "name=tested-tree-$tree" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.tree.outcome == 'success'
        with:
          name: ${{ steps.tree.outputs.name }}
          path: ${{ runner.temp }}/tree.txt
          retention-days: 7

      - name: Every job passed
        if: always()
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          PLAN: ${{ needs.plan.result }}
          CODE: ${{ needs.plan.outputs.code }}
          REASON: ${{ needs.plan.outputs.reason }}
          SHARDS: ${{ needs.shard.result }}
          EXTRAS: ${{ needs.extras.result }}
        run: |
          echo "plan=$PLAN code=$CODE shards=$SHARDS extras=$EXTRAS"
          if [ "$PLAN" != success ]; then
            echo "::error::the plan job failed: a suite is in two shards of tools/ci_shards.txt, a plan check failed, or the checkout failed"
            exit 1
          fi
          if [ "$PREFLIGHT" != success ] && [ "$PREFLIGHT" != skipped ]; then
            echo "::error::the preflight (a test runner does not compile) failed or was cancelled; full tests did not pass"
            exit 1
          fi
          if [ "$CODE" = true ]; then
            # The nightly balance run skips the dataset and harness checks.
            if [ "$SHARDS" != success ] || { [ "$EXTRAS" != success ] && [ "${{ github.event_name }}" != schedule ]; }; then
              echo "::error::a test shard or the dataset and harness checks did not pass"
              exit 1
            fi
          else
            echo "The game tests were skipped ($REASON)."
          fi
