name: Tests

# Code/data/config pull requests and pushes to main run the full check:
# project import, all Godot test suites, the dataset check and the intake
# harness. Documentation-only changes skip this expensive game test run.
# If a PR changes both docs and game files, the tests still run.
# tools/run_tests.sh is the same script you run locally.
#
# "test" is a required check on main, so every PR runs the job: a docs-only
# PR passes it in a few seconds without running the game tests. Pushes to
# main that only touch docs don't start it at all.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GODOT_VERSION: "4.7.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2     # the PR merge commit and the base it merges into

      # Anything outside docs/ and *.md files counts as code.
      - name: Check for code changes
        id: changes
        run: |
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if ! git diff --name-only HEAD^1 HEAD | grep -qvE '^docs/|\.md$'; then
              code=false
              echo "Documentation-only change: skipping the game tests."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.11"

      - name: Cache Godot
        if: steps.changes.outputs.code == 'true'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.changes.outputs.code == 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          name="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${name}.zip" \
          || curl -fsSL --retry 3 -o godot.zip \
            "https://downloads.godotengine.org/?version=${GODOT_VERSION}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          unzip -q godot.zip && rm godot.zip
          mv "${name}" godot && chmod +x godot

      - name: Run tests
        if: steps.changes.outputs.code == 'true'
        run: GODOT="$HOME/godot/godot" LOG_DIR="$RUNNER_TEMP/test-logs" tools/run_tests.sh

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs
